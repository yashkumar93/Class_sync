# Render Blueprint — Infrastructure as Code
# Push this to your repo and Render will auto-detect it.

services:
  - type: web
    name: classsync-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn classsync.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false        # set manually in Render dashboard to point to Supabase DB
      - key: SUPABASE_URL
        sync: false        # set manually in Render dashboard
      - key: SUPABASE_KEY
        sync: false        # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
