# Render Blueprint — Infrastructure as Code
# Push this to your repo and Render will auto-detect it.

databases:
  - name: classsync-db
    plan: free
    databaseName: classsync
    user: classsync_user

services:
  - type: web
    name: classsync-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn classsync.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: classsync-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
