<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Class Sync</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/classsync.css' %}">
</head>
<body>
<div class="cs-login-page">
  <div class="cs-login-card">
    <div class="cs-login-logo">
      <div style="margin-bottom:0.75rem;">
        <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="#1a56a0"/>
          <path d="M8 10h16M8 16h10M8 22h13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="24" cy="22" r="4" fill="#f0a500"/>
        </svg>
      </div>
      <div class="brand-name">Class Sync</div>
      <div class="tagline">Smart Attendance &amp; Academic Scheduling</div>
    </div>

    {% if form.errors %}
      <div class="cs-alert danger">
        <i class="bi bi-x-circle"></i>
        Invalid credentials. Please try again.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" autofocus required>
        </div>
      </div>
      <div class="mb-4">
        <label for="id_password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password" required>
        </div>
      </div>
      <button type="submit" class="btn-cs-primary w-100" style="justify-content:center; padding:0.65rem;">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>

    <p style="text-align:center; font-size:0.8rem; color:var(--cs-gray-400); margin-top:1.5rem; margin-bottom:0;">
      Class Sync v1.0 &mdash; Institution Portal
    </p>
  </div>
</div>
</body>
</html>
