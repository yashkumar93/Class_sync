{% extends "base.html" %}
{% block title %}Departments{% endblock %}
{% block content %}
<div class="cs-page-header d-flex align-items-center justify-content-between">
  <h1><i class="bi bi-building me-2" style="color:var(--cs-primary);"></i>Departments</h1>
  <a href="{% url 'admin_panel:department_create' %}" class="btn-cs-primary"><i class="bi bi-plus"></i> Add</a>
</div>
<div class="cs-table-wrapper">
  <table class="cs-table">
    <thead><tr><th>Code</th><th>Name</th><th>Courses</th><th>Members</th><th>Actions</th></tr></thead>
    <tbody>
    {% for d in departments %}
    <tr>
      <td class="fw-600">{{ d.code }}</td>
      <td>{{ d.name }}</td>
      <td><span class="cs-badge info">{{ d.course_count }}</span></td>
      <td><span class="cs-badge neutral">{{ d.member_count }}</span></td>
      <td><a href="{% url 'admin_panel:department_edit' d.pk %}" class="btn-cs-secondary" style="font-size:0.78rem;padding:0.3rem 0.7rem;"><i class="bi bi-pencil"></i></a></td>
    </tr>
    {% empty %}
    <tr><td colspan="5" class="text-muted text-center py-4">No departments yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
