name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes — Render free tier sleeps after 15 min of inactivity
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping ClassSync backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://class-sync-ah7n.onrender.com/api/health/)
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check returned $STATUS — server may be down"
          else
            echo "Server is awake ✅"
          fi
