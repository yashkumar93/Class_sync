# Railway configuration - Infrastructure as Code
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "nixpacks"
buildCommand = "python manage.py collectstatic --no-input"

[deploy]
startCommand = "python manage.py migrate && gunicorn classsync.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/api/health/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5